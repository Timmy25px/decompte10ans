<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Supprime les scrollbars */
    background: #000;
}

#canva {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

#canva iframe {
    position: absolute;
    top: 50%;
    left: 50%;

    /* Plus grand que le conteneur */
    width: 115%;
    height: 115%;

    /* Centre l'iframe */
    transform: translate(-50%, -50%);

    border: none;
}
</style>

</head>
<body>

<div id="canva">
    <iframe
        loading="lazy"
        src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
        allowfullscreen
        allow="fullscreen">
    </iframe>
</div>

<style>

#source-clock {
    position: fixed;

    top: 100px;
    left: 100px;

    width: 900px;
    height: 150px;

    border: 2px dashed transparent;

    resize: both;
    overflow: hidden;

    z-index:999999;

    cursor:move;
}

#source-clock:hover{
    border-color:#00aaff;
}


#source-clock iframe{
    width:100%;
    height:100%;
    border:0;
    pointer-events:none;
}

</style>


<div id="source-clock">

    <iframe src="clock-3.html"></iframe>

</div>


<script>

const box = document.getElementById("source-clock");

let move=false;
let offsetX=0;
let offsetY=0;


box.addEventListener("mousedown", e=>{

    move=true;

    offsetX=e.clientX-box.offsetLeft;
    offsetY=e.clientY-box.offsetTop;

});


document.addEventListener("mousemove",e=>{

    if(move){

        box.style.left=(e.clientX-offsetX)+"px";
        box.style.top=(e.clientY-offsetY)+"px";

    }

});


document.addEventListener("mouseup",()=>{

    move=false;

});

</script>

</body>
</html>
