<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#fakeLock{
    width:380px;
    background:#111;
    border:2px solid #333;
    border-radius:18px;
    padding:35px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,255,255,.08);
}

#fakeLock h2{
    color:#fff;
    font-size:30px;
    margin-bottom:25px;
}

#fakeLock input{
    width:100%;
    height:50px;
    border:none;
    outline:none;
    border-radius:12px;
    padding:0 15px;
    background:#1d1d1d;
    color:#fff;
    font-size:18px;
    margin-bottom:18px;
}

#fakeLock input::placeholder{
    color:#888;
}

#fakeLogin{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#8C52FF,#FF66C4,#FFDE59);
    transition:.25s;
}

#fakeLogin:hover{
    transform:scale(1.03);
}

#fakeError{
    color:#ff5a5a;
    margin-top:18px;
    min-height:24px;
    font-size:16px;
}

#protectedContent{
    display:none;
}
</style>
</head>

<body>

<div id="canva">
    <iframe
        loading="lazy"
        src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
        allowfullscreen
        allow="fullscreen">
    </iframe>
</div>

<style>

#source-clock {
    position: fixed;

    top: 100px;
    left: 100px;

    width: 900px;
    height: 150px;

    border: 2px dashed transparent;

    resize: both;
    overflow: hidden;

    z-index:999999;

    cursor:move;
}

#source-clock:hover{
    border-color:#00aaff;
}


#source-clock iframe{
    width:100%;
    height:100%;
    border:0;
    pointer-events:none;
}

</style>


<div id="source-clock">

    <iframe src="clock.html"></iframe>

</div>


<script>

const box = document.getElementById("source-clock");

let move=false;
let offsetX=0;
let offsetY=0;


box.addEventListener("mousedown", e=>{

    move=true;

    offsetX=e.clientX-box.offsetLeft;
    offsetY=e.clientY-box.offsetTop;

});


document.addEventListener("mousemove",e=>{

    if(move){

        box.style.left=(e.clientX-offsetX)+"px";
        box.style.top=(e.clientY-offsetY)+"px";

    }

});


document.addEventListener("mouseup",()=>{

    move=false;

});

</script>

</body>
</html>
