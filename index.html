<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
<style>

#toolbar {

position:fixed;
top:10px;
right:10px;
z-index:99999;

background:#111;
color:white;

padding:10px;
border-radius:10px;

font-family:Arial;

}


#toolbar button,
#toolbar select {

padding:7px;
margin:3px;

cursor:pointer;

}



#sourceIframe {

position:absolute;

left:100px;
top:100px;

width:1920px;
height:1080px;

overflow:hidden;

background:black;

border:2px dashed transparent;

box-sizing:border-box;

}


#sourceIframe.edit {

border-color:white;

}



#sourceIframe iframe {

width:100%;
height:100%;

border:0;

pointer-events:none;

}



/* poignées */

.handle {

position:absolute;

width:14px;
height:14px;

background:white;

border:2px solid black;

display:none;

z-index:999;

}



.edit .handle {

display:block;

}



.tl {left:-8px;top:-8px;cursor:nwse-resize;}
.tr {right:-8px;top:-8px;cursor:nesw-resize;}
.bl {left:-8px;bottom:-8px;cursor:nesw-resize;}
.br {right:-8px;bottom:-8px;cursor:nwse-resize;}

.ml {left:-8px;top:50%;cursor:ew-resize;}
.mr {right:-8px;top:50%;cursor:ew-resize;}

.mt {top:-8px;left:50%;cursor:ns-resize;}
.mb {bottom:-8px;left:50%;cursor:ns-resize;}



</style>





<div id="toolbar">

<button id="lock">
🔓 Déverrouiller
</button>


<select id="ratio">

<option value="screen">
Adapter écran
</option>

<option value="16:9">
16:9
</option>

<option value="4:3">
4:3
</option>

<option value="16:10">
16:10
</option>

<option value="21:9">
21:9
</option>

<option value="1:1">
1:1
</option>

</select>


<button id="reset">
↩ Reset
</button>


</div>





<script>


const box=document.getElementById("sourceIframe");

const lock=document.getElementById("lock");

const ratio=document.getElementById("ratio");

const reset=document.getElementById("reset");



let unlocked=true;



// ajout poignées

[
"tl","tr","bl","br",
"ml","mr","mt","mb"

].forEach(c=>{

let h=document.createElement("div");

h.className="handle "+c;

box.appendChild(h);


});



box.classList.add("edit");





// verrouillage


lock.onclick=()=>{


unlocked=!unlocked;


if(unlocked){

box.classList.add("edit");

lock.textContent="🔓 Déverrouiller";

}

else{

box.classList.remove("edit");

lock.textContent="🔒 Verrouillé";

}


};







// déplacement


let moving=false;

let startX,startY,startL,startT;



box.onmousedown=e=>{


if(!unlocked)return;

if(e.target.classList.contains("handle"))return;



moving=true;


startX=e.clientX;
startY=e.clientY;

startL=box.offsetLeft;
startT=box.offsetTop;


};



document.onmousemove=e=>{


if(moving){


box.style.left=
startL+(e.clientX-startX)+"px";


box.style.top=
startT+(e.clientY-startY)+"px";


}


};



document.onmouseup=()=>{

moving=false;

};








// resize + crop


let resizing=false;

let handle="";

let sx,sy;

let sw,sh;

let sl,st;



document.querySelectorAll(".handle")
.forEach(h=>{


h.onmousedown=e=>{


if(!unlocked)return;


resizing=true;

handle=h.classList[1];


sx=e.clientX;
sy=e.clientY;


sw=box.offsetWidth;
sh=box.offsetHeight;


sl=box.offsetLeft;
st=box.offsetTop;


e.stopPropagation();

};


});





document.onmousemove=e=>{


if(!resizing)return;


let dx=e.clientX-sx;

let dy=e.clientY-sy;



if(handle.includes("r"))
box.style.width=sw+dx+"px";


if(handle.includes("b"))
box.style.height=sh+dy+"px";



if(handle.includes("l")){

box.style.width=sw-dx+"px";
box.style.left=sl+dx+"px";

}



if(handle.includes("t")){

box.style.height=sh-dy+"px";
box.style.top=st+dy+"px";

}



};



document.onmouseup=()=>{

resizing=false;

};








// formats


ratio.onchange=()=>{


switch(ratio.value){


case "screen":

box.style.left="0px";
box.style.top="0px";

box.style.width="100vw";
box.style.height="100vh";

break;



case "16:9":

box.style.width="1920px";
box.style.height="1080px";

break;



case "4:3":

box.style.width="1440px";
box.style.height="1080px";

break;



case "16:10":

box.style.width="1920px";
box.style.height="1200px";

break;



case "21:9":

box.style.width="2560px";
box.style.height="1080px";

break;



case "1:1":

box.style.width="1080px";
box.style.height="1080px";

break;


}


};







reset.onclick=()=>{


box.style.left="100px";
box.style.top="100px";

box.style.width="1920px";
box.style.height="1080px";


};

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->
<button id="lockBtn">🔓 Déverrouiller</button>

<div id="editorFrame">
    <iframe 
        src="https://timmy25px.github.io/iframe-canva-2/"
        allowfullscreen>
    </iframe>
</div>


<script>
let locked = false;

const frame = document.getElementById("editorFrame");
const btn = document.getElementById("lockBtn");


btn.onclick = () => {

    locked = !locked;

    if(locked){

        frame.style.pointerEvents = "none";
        btn.innerHTML = "🔒 Verrouillé";

    } else {

        frame.style.pointerEvents = "auto";
        btn.innerHTML = "🔓 Déverrouiller";

    }

};
</script>
    
</script>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();


</script>


</body>
</html>
