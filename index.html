<style>
#accessScreen {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: Arial, sans-serif;
}

#accessBox {
    text-align: center;
}

#accessInput {
    padding: 10px;
    font-size: 18px;
    margin-top: 15px;
    text-align: center;
}

#accessButton {
    padding: 10px 20px;
    margin-top: 15px;
    cursor: pointer;
}

#playButton {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 99999;
    display: none;
    background: rgba(0,0,0,0.5);
    color: white;
    border: 1px solid white;
    border-radius: 8px;
    padding: 8px 15px;
    cursor: pointer;
}
</style>


<div id="accessScreen">
    <div id="accessBox">
        <h2>Accès protégé</h2>
        <input id="accessInput" type="password" placeholder="Code d'accès">
        <br>
        <button id="accessButton">Valider</button>
        <p id="error"></p>
    </div>
</div>


<div style="position: relative; width: 100%; height: 0; padding-top: 66.6667%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">

    src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
    allowfullscreen="allowfullscreen"
    allow="fullscreen">
  </iframe>

target="_blank" rel="noopener"> _</a> par Tim Gaudinaud



<audio id="backgroundMusic" loop>
    <source src="https://drive.google.com/uc?export=download&id=1uSqnzRoFRXHXd797D4a3UDnaKD4suJ3b" type="audio/mpeg">
</audio>

<audio id="zeroSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a" type="audio/mp4">
</audio>


<button id="playButton">Play</button>


<script>
const accessHash =
"4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(hash)]
        .map(b => b.toString(16).padStart(2,"0"))
        .join("");
}


const accessScreen = document.getElementById("accessScreen");
const accessInput = document.getElementById("accessInput");
const accessButton = document.getElementById("accessButton");
const error = document.getElementById("error");

const music = document.getElementById("backgroundMusic");
const zero = document.getElementById("zeroSound");
const playButton = document.getElementById("playButton");


let unlocked = false;


accessButton.onclick = async () => {

    const hash = await sha256(accessInput.value);

    if(hash === accessHash){

        unlocked = true;

        accessScreen.style.display = "none";

        music.volume = 1;

        music.play().catch(()=>{
            playButton.style.display = "block";
        });

    } else {
        error.textContent = "Code incorrect";
    }
};



playButton.onclick = () => {
    music.play();
    playButton.style.display = "none";
};



const targetFade = Date.UTC(2032,7,28,13,42,50);
const targetZero = Date.UTC(2032,7,28,13,44,0);


let fadeStarted = false;
let zeroPlayed = false;


function syncAudio(){

    if(!unlocked) return;


    const now = Date.now();


    // Fondu descendant 10 secondes
    if(now >= targetFade && now < targetFade + 10000 && !fadeStarted){

        fadeStarted = true;

        let startVolume = music.volume;
        let start = Date.now();

        let fade = setInterval(()=>{

            let elapsed = Date.now() - start;
            let progress = elapsed / 10000;

            music.volume = Math.max(
                0,
                startVolume * (1 - progress)
            );

            if(progress >= 1){
                clearInterval(fade);
                music.volume = 0;
            }

        },50);
    }



    // Lancement du second son
    if(now >= targetZero && !zeroPlayed){

        zeroPlayed = true;
        zero.play();

    }

}


setInterval(syncAudio,100);



</script>
