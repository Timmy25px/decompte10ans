<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


#sourceIframe {

    position:absolute;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    overflow:hidden;

    z-index:1;

}


#sourceIframe iframe {

    width:100%;
    height:100%;

    border:0;

    display:block;

}


#obsToolbar {

    position:fixed;

    top:20px;
    left:20px;

    z-index:999999;

}


.obsButton,
#formatSelect {

    padding:12px 18px;

    border-radius:14px;

    border:9px solid transparent;

    border-image:linear-gradient(
        90deg,
        #8C52FF,
        #FF914D
    ) 1;


    background:linear-gradient(
        90deg,
        #FF66C4,
        #FFDE59
    );


    color:white;

    font-weight:bold;

    cursor:pointer;

}

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->
<div id="sourceIframe">

<iframe
src="https://timmy25px.github.io/iframe-canva-2/"
allowfullscreen>
</iframe>

</div>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();

</script>
<script>

window.addEventListener("load",()=>{


let iframe = document.querySelector("#sourceIframe iframe");


if(!iframe){

console.log("iframe introuvable");

return;

}



let toolbar=document.createElement("div");

toolbar.id="obsToolbar";


toolbar.innerHTML=`

<button class="obsButton" id="lock">
🔓 Déverrouiller
</button>


<select id="formatSelect">

<option>Adapter écran</option>
<option>16:9</option>
<option>4:3</option>

</select>

`;

document.body.appendChild(toolbar);



let locked=false;



document.getElementById("lock").onclick=function(){


locked=!locked;


this.textContent =
locked ?
"🔒 Verrouillé"
:
"🔓 Déverrouiller";


};

document.getElementById("formatSelect").addEventListener("change", function(){

    const box = document.getElementById("sourceIframe");

    let w = 0;
    let h = 0;


    if(this.value === "16:9"){
        w = 1920;
        h = 1080;
    }


    else if(this.value === "4:3"){
        w = 1440;
        h = 1080;
    }


    else if(this.value === "Adapter écran"){
        w = window.innerWidth;
        h = window.innerHeight;
    }


    box.style.width = w + "px";
    box.style.height = h + "px";


    // centrage de la source uniquement
    box.style.left = ((window.innerWidth - w) / 2) + "px";
    box.style.top = ((window.innerHeight - h) / 2) + "px";


</body>
</html>
