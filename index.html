<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compteur sécurisé</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
}

/* Écran de code */
#accessScreen {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

#codeInput {
    padding: 12px;
    font-size: 18px;
    text-align: center;
    border-radius: 8px;
    border: none;
    margin-top: 15px;
}

#accessBtn {
    margin-top: 15px;
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* Contenu Canva */
#content {
    display: none;
    width: 100vw;
    height: 100vh;
}

/* Bouton audio */
#playBtn {
    display: none;
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9998;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid white;
    border-radius: 20px;
    padding: 8px 18px;
    cursor: pointer;
}

iframe {
    width:100%;
    height:100%;
    border:none;
}
</style>

</head>

<body>

<div id="accessScreen">
    <div>Code d'accès</div>
    <input id="codeInput" type="password">
    <button id="accessBtn">Valider</button>
</div>


<div id="content">

<div style="position: relative; width: 100%; height: 0; padding-top: 66.6667%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">

<iframe loading="lazy"
src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
allowfullscreen="allowfullscreen"
allow="fullscreen">
</iframe>

</div>

</div>


<button id="playBtn">Play</button>


<audio id="music" loop>
    <source src="https://drive.google.com/uc?export=download&id=1uSqnzRoFRXHXd797D4a3UDnaKD4suJ3b" type="audio/mpeg">
</audio>


<audio id="zeroSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a" type="audio/mp4">
</audio>



<script>

/* Hash SHA-256 du code */
const ACCESS_HASH =
"c1f8e9f7c8e6e7e7c3c9b8e1b8d3e3d7c7f7e9e5a9f5b5d8e4c2a3b1f9a7c6";


async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);

    return [...new Uint8Array(hash)]
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}



const accessScreen=document.getElementById("accessScreen");
const content=document.getElementById("content");
const codeInput=document.getElementById("codeInput");
const accessBtn=document.getElementById("accessBtn");

const music=document.getElementById("music");
const zeroSound=document.getElementById("zeroSound");
const playBtn=document.getElementById("playBtn");


accessBtn.onclick=async()=>{

    const hash=await sha256(codeInput.value);

    if(hash===ACCESS_HASH){

        accessScreen.style.display="none";
        content.style.display="block";

        music.volume=1;

        music.play().catch(()=>{
            playBtn.style.display="block";
        });

    } else {
        codeInput.value="";
        alert("Code incorrect");
    }

};



playBtn.onclick=()=>{
    music.play();
    playBtn.style.display="none";
};



/* Synchronisation UTC */

const fadeStart = Date.UTC(2032,7,28,13,42,50);
const zeroTime = Date.UTC(2032,7,28,13,44,0);


function syncAudio(){

    const now=Date.now();


    /* Fondu descendant 10 secondes */

    if(now>=fadeStart && now<fadeStart+10000){

        let remaining = 1-(now-fadeStart)/10000;

        music.volume=Math.max(0,remaining);

    }


    if(now>=fadeStart+10000){

        music.volume=0;

    }



    /* Second son */

    if(now>=zeroTime && zeroSound.paused){

        zeroSound.play();

    }

}


setInterval(syncAudio,50);


</script>


</body>
</html>
