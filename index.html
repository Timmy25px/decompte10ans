<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
}

#lockScreen {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
    font-family: Arial, sans-serif;
}

#codeInput {
    padding: 10px;
    font-size: 18px;
    text-align: center;
}

#validateBtn {
    margin-top: 15px;
    padding: 10px 25px;
    cursor: pointer;
}

#error {
    color: red;
    margin-top: 10px;
}

#content {
    display: none;
}

#playBtn {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 9998;
    display: none;
    opacity: 0.7;
    background: black;
    color: white;
    border: 1px solid white;
    padding: 8px 14px;
    border-radius: 5px;
}
</style>

</head>

<body>

<div id="lockScreen">

    <h2>Accès sécurisé</h2>

    <input id="codeInput" type="password" placeholder="Code">

    <button id="validateBtn">
        Valider
    </button>

    <div id="error"></div>

</div>


<div id="content">

<div style="position: relative; width: 100%; height: 0; padding-top: 66.6667%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">

<iframe loading="lazy"
style="position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;"
src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
allowfullscreen="allowfullscreen"
allow="fullscreen">
</iframe>

</div>

</div>


<button id="playBtn">▶ Play</button>


<audio id="music" loop>
<source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="zero">
<source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const input = document.getElementById("codeInput");
const btn = document.getElementById("validateBtn");

const lock = document.getElementById("lockScreen");
const content = document.getElementById("content");

const music = document.getElementById("music");
const zero = document.getElementById("zero");

const playBtn = document.getElementById("playBtn");


// hash du code (évite le texte visible)
const accessHash =
"f7c5fdb9f3c0f4b4bdbfdbd7c8a8e7b2";


async function hash(text){

let data = new TextEncoder().encode(text);

let hashBuffer =
await crypto.subtle.digest("SHA-256", data);

return Array.from(
new Uint8Array(hashBuffer)
)
.map(b=>b.toString(16).padStart(2,"0"))
.join("");

}



btn.onclick = async()=>{

let result = await hash(input.value);

if(result === accessHash){

lock.style.display="none";
content.style.display="block";

startMusic();

}

else{

document.getElementById("error").innerHTML =
"Code incorrect";

}

};



function startMusic(){

music.volume = 1;

music.play().catch(()=>{

playBtn.style.display="block";

});

}



playBtn.onclick=()=>{

music.play();

playBtn.style.display="none";

};



// Heure UTC

function utcNow(){

return new Date();

}



let faded=false;
let white=false;
let secondStarted=false;


function checkTime(){


let now = utcNow();


let fadeTime =
Date.UTC(2032,7,28,13,42,50);


let whiteTime =
Date.UTC(2032,7,28,13,43,59);


let zeroTime =
Date.UTC(2032,7,28,13,44,0);



let current =
now.getTime();



/* fondu 10 secondes */

if(current >= fadeTime &&
current < fadeTime+10000 &&
!faded){

let elapsed =
(current-fadeTime)/10000;

music.volume =
Math.max(0,1-elapsed);

}


if(current >= fadeTime+10000 && !faded){

music.volume=0;
faded=true;

}



/* écran blanc */

if(current >= whiteTime && !white){

document.body.style.background="white";

content.style.display="none";

white=true;

}



/* second son */

if(current >= zeroTime &&
!secondStarted){

secondStarted=true;

zero.play();

setTimeout(()=>{

music.currentTime=0;
music.volume=1;
music.play();

},10000);


}


}



setInterval(checkTime,50);


</script>


</body>
</html>
