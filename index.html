<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>

/* =========================
   BARRE DE CONTROLE
========================= */

#toolbar {

    position: fixed;
    top: 20px;
    right: 20px;

    z-index: 99999;

    display:flex;
    gap:10px;

    padding:12px;

    background:rgba(0,0,0,0.55);

    backdrop-filter:blur(10px);

    border-radius:18px;

}


/* Boutons modernes */

#toolbar button,
#toolbar select {


    font-family:Lato, Arial, sans-serif;

    font-size:16px;
    font-weight:700;

    color:white;

    padding:10px 18px;

    border-radius:14px;

    border:9px solid transparent;

    background:
    linear-gradient(90deg,#FF66C4,#FFDE59) padding-box,
    linear-gradient(90deg,#8C52FF,#FF914D) border-box;


    cursor:pointer;

    transition:0.2s;

}


#toolbar button:hover,
#toolbar select:hover {

    transform:scale(1.05);

}



/* =========================
   SOURCE IFRAME
========================= */


#sourceIframe {


    position:absolute;


    left:100px;
    top:100px;


    width:1920px;
    height:1080px;


    overflow:hidden;


    border:2px dashed transparent;


}


#sourceIframe.edit {

    border-color:white;

}



/* iframe intact */

#sourceIframe iframe {


    width:100%;
    height:100%;


    border:none;


    display:block;


}






/* poignées */

.handle {


    position:absolute;

    width:14px;
    height:14px;


    background:white;

    border:2px solid black;

    border-radius:50%;


    display:none;


    z-index:10;


}


.edit .handle {

    display:block;

}


.tl {

left:-7px;
top:-7px;
cursor:nwse-resize;

}


.tr {

right:-7px;
top:-7px;
cursor:nesw-resize;

}


.bl {

left:-7px;
bottom:-7px;
cursor:nesw-resize;

}


.br {

right:-7px;
bottom:-7px;
cursor:nwse-resize;

}


#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->
<div id="sourceIframe">

<iframe 
src="https://timmy25px.github.io/iframe-canva-2/"
allowfullscreen>
</iframe>

</div>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();


</script>
<div id="toolbar">

<button id="lockBtn">
🔓 Déverrouiller
</button>


<select id="format">

<option>
Adapter écran
</option>

<option>
16:9
</option>

<option>
4:3
</option>

<option>
16:10
</option>

<option>
21:9
</option>


</select>


<button id="cropBtn">
✂️ Crop
</button>


</div>



<script>


const box=document.getElementById("sourceIframe");

const lock=document.getElementById("lockBtn");

const format=document.getElementById("format");

const crop=document.getElementById("cropBtn");


let unlocked=true;

let moving=false;

let resizing=false;

let startX,startY,startW,startH,startL,startT;



/* verrouillage */

lock.onclick=()=>{

unlocked=!unlocked;


if(unlocked){

box.classList.add("edit");

lock.textContent="🔓 Déverrouiller";

}

else{

box.classList.remove("edit");

lock.textContent="🔒 Verrouillé";

}


};




/* déplacement */

box.onmousedown=e=>{


if(!unlocked)return;


if(e.target.classList.contains("handle"))
return;


moving=true;


startX=e.clientX-box.offsetLeft;

startY=e.clientY-box.offsetTop;


};




document.onmousemove=e=>{


if(moving){

box.style.left=
(e.clientX-startX)+"px";


box.style.top=
(e.clientY-startY)+"px";

}



};




document.onmouseup=()=>{

moving=false;

resizing=false;

};




/* formats */

format.onchange=()=>{


if(format.value=="Adapter écran"){

box.style.left="0px";
box.style.top="0px";

box.style.width="100vw";
box.style.height="100vh";


}


if(format.value=="16:9"){

box.style.width="1920px";
box.style.height="1080px";

}


if(format.value=="4:3"){

box.style.width="1440px";
box.style.height="1080px";

}


if(format.value=="16:10"){

box.style.width="1920px";
box.style.height="1200px";

}


if(format.value=="21:9"){

box.style.width="2560px";
box.style.height="1080px";

}


};





/* crop simple */

let cropOn=false;


crop.onclick=()=>{


cropOn=!cropOn;


if(cropOn){

box.style.clipPath="inset(50px 50px 50px 50px)";

crop.textContent="✂️ Crop ON";

}

else{

box.style.clipPath="none";

crop.textContent="✂️ Crop";

}


};





box.classList.add("edit");


</script>
</body>
</html>
