<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
html, body {
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:black;
}

/* Écran code */
#lockScreen {
    position:fixed;
    inset:0;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    font-family:Arial, sans-serif;
}

#codeInput {
    padding:12px;
    font-size:18px;
    text-align:center;
    border-radius:8px;
    border:none;
}

#unlockBtn {
    margin-top:15px;
    padding:10px 20px;
    border-radius:8px;
    border:none;
    cursor:pointer;
}

#error {
    margin-top:10px;
    color:red;
}

/* Bouton musique */
#playButton {
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:9998;
    display:none;
    background:rgba(0,0,0,0.5);
    color:white;
    border:1px solid white;
    border-radius:8px;
    padding:8px 15px;
    cursor:pointer;
}

/* Canva */
#canvaContainer {
    width:100%;
    height:100%;
}
</style>
</head>


<body>


<div id="lockScreen">

    <h2>Accès sécurisé</h2>

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button id="unlockBtn">Valider</button>

    <div id="error"></div>

</div>



<div id="canvaContainer">

<div style="position: relative; width: 100%; height: 0; padding-top: 66.6667%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); 
 margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">

<iframe loading="lazy"
style="position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;"
src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
allowfullscreen="allowfullscreen"
allow="fullscreen">
</iframe>

</div>

</div>



<button id="playButton">▶ Play</button>



<audio id="backgroundMusic" loop>
<source src="https://drive.google.com/uc?export=download&id=1uSqnzRoFRXHXd797D4a3UDnaKD4suJ3b" type="audio/mpeg">
</audio>


<audio id="zeroSound">
<source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a" type="audio/mp4">
</audio>



<script>

const passwordHash =
"4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";

const lockScreen=document.getElementById("lockScreen");
const input=document.getElementById("codeInput");
const button=document.getElementById("unlockBtn");
const error=document.getElementById("error");

const music=document.getElementById("backgroundMusic");
const zero=document.getElementById("zeroSound");
const playButton=document.getElementById("playButton");

let unlocked=false;
let fadeDone=false;
let zeroPlayed=false;



async function sha256(text){

const data=new TextEncoder().encode(text);

const hash=await crypto.subtle.digest(
"SHA-256",
data
);

return Array.from(new Uint8Array(hash))
.map(b=>b.toString(16).padStart(2,"0"))
.join("");

}



button.onclick=async()=>{

const hash=await sha256(input.value);

if(hash===passwordHash){

unlocked=true;

lockScreen.style.display="none";

playButton.style.display="block";

music.volume=1;

music.play().catch(()=>{});

}

else{

error.textContent="Code incorrect";

}

};




playButton.onclick=()=>{

music.play();

};





function checkTime(){

if(!unlocked)return;


let now=new Date();

let targetFade=
Date.UTC(2032,7,28,13,42,50);

let targetZero=
Date.UTC(2032,7,28,13,44,0);


let current=now.getTime();



/* Fondu 10 secondes */

if(current>=targetFade && current<targetFade+10000){

let remaining=(targetFade+10000-current)/10000;

music.volume=Math.max(0,remaining);

fadeDone=true;

}


if(current>=targetFade+10000 && !fadeDone){

music.volume=0;

}



/* Second son */

if(current>=targetZero && !zeroPlayed){

zero.play().catch(()=>{});

zeroPlayed=true;

}


}



setInterval(checkTime,100);



</script>


</body>
</html>
