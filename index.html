<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
#toolbar {

position:fixed;
top:10px;
right:10px;

background:#111;
color:white;

padding:10px;

border-radius:8px;

z-index:99999;

font-family:Arial;

}



#toolbar button,
#toolbar select {

padding:6px;
margin:3px;

}



#sourceIframe {

position:absolute;

left:100px;
top:100px;

width:1920px;
height:1080px;


overflow:hidden;

border:2px dashed transparent;


}



#sourceIframe.edit {

border-color:white;

}



#sourceIframe iframe {


width:100%;
height:100%;

border:0;

pointer-events:none;

}



/* poignées */

.handle {

position:absolute;

width:12px;
height:12px;

background:white;

border:1px solid black;

display:none;

z-index:10;

}



.edit .handle {

display:block;

}



.tl {left:-6px;top:-6px;cursor:nwse-resize;}
.tr {right:-6px;top:-6px;cursor:nesw-resize;}
.bl {left:-6px;bottom:-6px;cursor:nesw-resize;}
.br {right:-6px;bottom:-6px;cursor:nwse-resize;}



</style>



<div id="toolbar">

<button id="lockBtn">
🔓 Déverrouiller
</button>


<select id="ratio">

<option value="screen">
Adapter écran
</option>

<option value="16/9">
16:9
</option>

<option value="4/3">
4:3
</option>

<option value="16/10">
16:10
</option>

<option value="21/9">
21:9
</option>

<option value="1/1">
1:1
</option>

</select>


<button id="cropBtn">
✂️ Crop
</button>


</div>





<script>


const box=document.getElementById("sourceIframe");

const lockBtn=document.getElementById("lockBtn");

const ratio=document.getElementById("ratio");

const cropBtn=document.getElementById("cropBtn");


let unlocked=true;

let crop=false;



// poignées

["tl","tr","bl","br"].forEach(c=>{

let h=document.createElement("div");

h.className="handle "+c;

box.appendChild(h);


h.onmousedown=e=>{

if(!unlocked)return;


resize=true;

corner=c;

startX=e.clientX;

startY=e.clientY;

startW=box.offsetWidth;

startH=box.offsetHeight;


e.stopPropagation();

};


});





// verrouillage


lockBtn.onclick=()=>{


unlocked=!unlocked;


if(unlocked){

box.classList.add("edit");

lockBtn.innerHTML="🔓 Déverrouiller";

}

else{

box.classList.remove("edit");

lockBtn.innerHTML="🔒 Verrouillé";

}


save();


};





// déplacement


let drag=false;


box.onmousedown=e=>{


if(!unlocked)return;

if(e.target.className.includes("handle"))return;


drag=true;


dx=e.clientX-box.offsetLeft;
dy=e.clientY-box.offsetTop;


};



document.onmousemove=e=>{


if(drag){


box.style.left=e.clientX-dx+"px";
box.style.top=e.clientY-dy+"px";


}



if(resize){


let dw=e.clientX-startX;
let dh=e.clientY-startY;


if(corner.includes("r"))
box.style.width=startW+dw+"px";


if(corner.includes("b"))
box.style.height=startH+dh+"px";



if(corner.includes("l")){

box.style.width=startW-dw+"px";
box.style.left=box.offsetLeft+dw+"px";

}


if(corner.includes("t")){

box.style.height=startH-dh+"px";
box.style.top=box.offsetTop+dh+"px";

}


}


};



document.onmouseup=()=>{

drag=false;
resize=false;

save();

};





// crop OBS-like


cropBtn.onclick=()=>{

crop=!crop;


if(crop){

box.style.clipPath="inset(10px 10px 10px 10px)";

cropBtn.innerHTML="✂️ Crop ON";

}

else{

box.style.clipPath="none";

cropBtn.innerHTML="✂️ Crop OFF";

}


};





// formats


ratio.onchange=()=>{


switch(ratio.value){


case"screen":

box.style.width=innerWidth+"px";
box.style.height=innerHeight+"px";

break;


case"16/9":

box.style.width="1920px";
box.style.height="1080px";

break;


case"4/3":

box.style.width="1440px";
box.style.height="1080px";

break;


case"16/10":

box.style.width="1920px";
box.style.height="1200px";

break;


case"21/9":

box.style.width="2560px";
box.style.height="1080px";

break;


case"1/1":

box.style.width="1080px";
box.style.height="1080px";

break;


}


save();

};





// sauvegarde


function save(){

localStorage.setItem("iframeTransform",
JSON.stringify({

left:box.style.left,
top:box.style.top,
width:box.style.width,
height:box.style.height

}));

}



let saved=JSON.parse(localStorage.getItem("iframeTransform"));


if(saved){

box.style.left=saved.left;
box.style.top=saved.top;
box.style.width=saved.width;
box.style.height=saved.height;

}



box.classList.add("edit");

let resize=false;

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->
<div id="sourceIframe">
    <iframe 
        src="https://timmy25px.github.io/iframe-canva-2/"
        allowfullscreen>
    </iframe>
</div>
</script>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();


</script>


</body>
</html>
