<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
/* Menu taille écran */

#sizeMenu {
    position: fixed;
    top: 20px;
    left: 160px;

    z-index: 99999;

    padding: 8px 12px;

    font-family: Arial, sans-serif;
    font-size: 15px;

    background: white;
    color: black;

    border-radius: 6px;
    border: 1px solid #777;

    cursor: pointer;
}


/* bouton verrouillage */

#lock {
    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 99999;

    padding: 8px 15px;

    border-radius: 6px;

    cursor: pointer;

}


/* caché quand verrouillé */

.locked-mode #sizeMenu {
    display:none;
}
    
#lockScreen {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    flex-direction: column;
    color: white;
    font-family: Arial, sans-serif;
}

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->

<button id="lock">
🔒 Verrouiller
</button>


<select id="sizeMenu">

<option value="1920x1080">
Adapter à l'écran (16:9)
</option>

<option value="1280x720">
1280x720 HD
</option>

<option value="1024x576">
1024x576
</option>

<option value="800x450">
800x450
</option>

<option value="1440x1080">
4:3 HD
</option>

<option value="1024x768">
4:3 classique
</option>

<option value="640x480">
4:3 ancien
</option>

</select>


<div id="canvasEditor">

<iframe id="canvaFrame"
src="https://timmy25px.github.io/iframe-canva-2/">
</iframe>

</div>



<script>

const menu = document.getElementById("sizeMenu");
const editor = document.getElementById("canvasEditor");
const lockButton = document.getElementById("lock");


let locked = false;



menu.onchange = function(){

    if(locked) return;


    let size=this.value.split("x");


    editor.style.width=size[0]+"px";
    editor.style.height=size[1]+"px";

};



lockButton.onclick=function(){


    locked=!locked;


    if(locked){

        document.body.classList.add("locked-mode");

        this.innerHTML="🔓 Déverrouiller";

    }

    else{

        document.body.classList.remove("locked-mode");

        this.innerHTML="🔒 Verrouiller";

    }


};

</script>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();


</script>


</body>
</html>
