<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


/* Le compteur devient directement la page */

#counter-container {

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

}


/* Intégration simple du compteur */

#counter-frame {

    width:100%;
    height:100%;

    border:0;

    display:block;

}


/* Bouton de secours navigateur */

#playButton {

    display:none;

    position:fixed;

    bottom:15px;
    right:15px;

    z-index:99998;

    background:rgba(0,0,0,0.5);

    color:white;

    border:none;

    padding:8px 14px;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

}


/* écran blanc synchronisé */

#whiteFade {

    position:fixed;

    inset:0;

    background:white;

    opacity:0;

    pointer-events:none;

    z-index:99997;

    transition:opacity 1s linear;

}


</style>

</head>


<body>


<!-- COMPTEUR DIRECTEMENT DANS LA PAGE -->

<div id="counter-container">

<link rel="stylesheet" href="style.css">

<div id="obs-wrapper">


    <iframe src="canva-iframe.html"></iframe>


    <div class="resize-handle resize-top" data-side="top"></div>

    <div class="resize-handle resize-bottom" data-side="bottom"></div>

    <div class="resize-handle resize-left" data-side="left"></div>

    <div class="resize-handle resize-right" data-side="right"></div>


</div>

<script src="obs-controls.js"></script>

<script src="music-sync.js"></script>

<!-- Bouton si autoplay bloqué -->

<button id="playButton">
▶ Play
</button>



<!-- écran blanc final -->

<div id="whiteFade"></div>



<!-- Musique principale -->

<audio id="mainMusic" loop>

<source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">

</audio>



<!-- Deuxième son -->

<audio id="secondSound">

<source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">

</audio>



<script>

const mainMusic =
document.getElementById("mainMusic");


const secondSound =
document.getElementById("secondSound");


const playButton =
document.getElementById("playButton");



let started = false;



function startMusic(){


    mainMusic.volume = 1;


    mainMusic.play()

    .catch(()=>{

        playButton.style.display="block";

    });


}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};



/*
Synchronisation UTC
*/

const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    const now = Date.now();



    // lancement automatique de la musique

    if(!started){

        started=true;

        startMusic();

    }



    // fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){


        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);



        mainMusic.volume =
        Math.max(0,1-progress);


    }



    // écran blanc

    if(now >= whiteScreen){


        document.getElementById("whiteFade")
        .style.opacity="1";


    }



    // deuxième son

    if(now >= secondStart && secondSound.paused){


        mainMusic.pause();


        secondSound.play();



        setTimeout(()=>{


            mainMusic.currentTime=0;

            mainMusic.volume=1;


            mainMusic.play();


        },10000);



    }



    requestAnimationFrame(timer);

}



timer();


</script>



</script>
</body>
</html>
