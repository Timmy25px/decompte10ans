<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
}

/* Écran de sécurité */
#accessScreen {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 99999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    font-family: Arial, sans-serif;
}

#accessBox {
    text-align: center;
}

#codeInput {
    padding: 10px;
    font-size: 18px;
    text-align: center;
}

#validateBtn {
    margin-top: 10px;
    padding: 10px 20px;
    cursor: pointer;
}

#error {
    color: red;
    margin-top: 10px;
}


/* Bouton Play discret */
#playButton {
    position: fixed;
    right: 15px;
    bottom: 15px;
    z-index: 9999;
    display: none;
    background: rgba(0,0,0,0.5);
    color: white;
    border: 1px solid white;
    border-radius: 5px;
    padding: 8px 14px;
    cursor: pointer;
}


/* Contenu Canva */
#content {
    display: none;
}
</style>

</head>

<body>


<!-- Demande de code -->
<div id="accessScreen">

    <div id="accessBox">

        <h2>Accès protégé</h2>

        <input id="codeInput"
               type="password"
               placeholder="Code d'accès">

        <br>

        <button id="validateBtn">
            Valider
        </button>

        <div id="error"></div>

    </div>

</div>



<!-- Contenu principal -->
<div id="content">

<div style="position: relative; width: 100%; height: 0; padding-top: 66.6667%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">

<iframe loading="lazy"
style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
allowfullscreen="allowfullscreen"
allow="fullscreen">
</iframe>

</div>


<a href="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?utm_content=DAHQHalUtOM&utm_campaign=designshare&utm_medium=embeds&utm_source=link"
target="_blank"
rel="noopener">
_
</a>
par Tim Gaudinaud


</div>



<!-- Audio fond -->
<audio id="backgroundMusic" loop>
    <source src="https://drive.google.com/uc?export=download&id=1uSqnzRoFRXHXd797D4a3UDnaKD4suJ3b"
    type="audio/mpeg">
</audio>


<!-- Second son -->
<audio id="zeroSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a"
    type="audio/mp4">
</audio>


<button id="playButton">
Play
</button>



<script>


// Hash SHA-256 du code d'accès (le code n'est pas stocké en clair)
const ACCESS_HASH =
"4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash =
    await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return Array.from(
        new Uint8Array(hash)
    )
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



const accessScreen =
document.getElementById("accessScreen");

const content =
document.getElementById("content");

const input =
document.getElementById("codeInput");

const button =
document.getElementById("validateBtn");

const error =
document.getElementById("error");

const music =
document.getElementById("backgroundMusic");

const playButton =
document.getElementById("playButton");

const zeroSound =
document.getElementById("zeroSound");



let accessGranted = false;



button.onclick = async function(){

    const hash =
    await sha256(input.value);


    if(hash === ACCESS_HASH){

        accessGranted = true;

        accessScreen.style.display="none";

        content.style.display="block";

        music.volume = 1;

        music.play()
        .catch(()=>{
            playButton.style.display="block";
        });


    } else {

        error.textContent =
        "Code incorrect";

    }

};



// Bouton manuel si autoplay bloqué
playButton.onclick=function(){

    music.play();

    playButton.style.display="none";

};




// Synchronisation UTC
function checkTime(){

    if(!accessGranted)
        return;


    const now =
    new Date();


    const targetFade =
    Date.UTC(
        2032,
        7,
        28,
        13,
        42,
        50
    );


    const targetZero =
    Date.UTC(
        2032,
        7,
        28,
        13,
        44,
        0
    );



    const current =
    now.getTime();



    // Fondu descendant sur 10 secondes
    if(
        current >= targetFade &&
        current <= targetFade + 10000
    ){

        let progress =
        (current-targetFade)/10000;

        music.volume =
        Math.max(
            0,
            1-progress
        );

    }



    // Lancement du second son exactement à l'heure UTC
    if(
        current >= targetZero &&
        current <= targetZero + 1000 &&
        zeroSound.paused
    ){

        zeroSound.play();

    }


}



setInterval(checkTime,50);


</script>


</body>
</html>
