<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
#tools {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 99999;
    background: rgba(0,0,0,.7);
    padding: 10px;
    border-radius: 10px;
    font-family: Arial;
    color:white;
}


#tools button,
#tools select {

    margin:3px;
    padding:8px;

    cursor:pointer;

}

<div id="iframe-container">

    <iframe 
        src="https://timmy25px.github.io/iframe-canva-2/"
        allowfullscreen="allowfullscreen"
        allow="fullscreen">
    </iframe>

    <div id="top-left" class="handle"></div>
    <div id="top-right" class="handle"></div>
    <div id="bottom-left" class="handle"></div>
    <div id="bottom-right" class="handle"></div>

</div>

#iframe-container iframe {

    width:100%;
    height:100%;

    border:0;

    pointer-events:none;

}


/* poignées */
.handle {

    position:absolute;

    width:14px;
    height:14px;

    background:white;

    display:none;

}


#top-left {
    left:-7px;
    top:-7px;
    cursor:nwse-resize;
}

#top-right {
    right:-7px;
    top:-7px;
    cursor:nesw-resize;
}

#bottom-left {
    left:-7px;
    bottom:-7px;
    cursor:nesw-resize;
}

#bottom-right {
    right:-7px;
    bottom:-7px;
    cursor:nwse-resize;
}


</style>



<div id="tools">

<button id="lock">
🔓 Déverrouiller
</button>


<select id="ratio">

<option value="screen">
Adapter écran
</option>

<option value="4:3">
4:3
</option>

<option value="16:9">
16:9
</option>

<option value="1:1">
Carré
</option>

</select>


</div>


<script>

const box = document.getElementById("iframe-container");
const lockBtn = document.getElementById("lock");
const ratio = document.getElementById("ratio");


let locked = true;

let dragging=false;

let startX,startY,startLeft,startTop;



function setLock(){

    if(locked){

        locked=false;

        lockBtn.innerHTML="🔒 Verrouiller";

        box.style.border="2px dashed red";

        document.querySelectorAll(".handle")
        .forEach(h=>h.style.display="block");

        box.style.cursor="move";

    }

    else{

        locked=true;

        lockBtn.innerHTML="🔓 Déverrouiller";

        box.style.border="0";

        document.querySelectorAll(".handle")
        .forEach(h=>h.style.display="none");

    }

}


lockBtn.onclick=setLock;



/* déplacement */

box.onmousedown=e=>{

if(locked)return;


dragging=true;

startX=e.clientX;
startY=e.clientY;

startLeft=box.offsetLeft;
startTop=box.offsetTop;


};


document.onmousemove=e=>{


if(!dragging)return;


box.style.left=
startLeft+(e.clientX-startX)+"px";


box.style.top=
startTop+(e.clientY-startY)+"px";


};


document.onmouseup=()=>{

dragging=false;

};




/* formats */

ratio.onchange=()=>{


let w=window.innerWidth;
let h=window.innerHeight;


if(ratio.value=="screen"){

box.style.width=w+"px";
box.style.height=h+"px";

}


if(ratio.value=="16:9"){

box.style.width="1920px";
box.style.height="1080px";

}


if(ratio.value=="4:3"){

box.style.width="1440px";
box.style.height="1080px";

}


if(ratio.value=="1:1"){

box.style.width="1080px";
box.style.height="1080px";

}


};



/* redimension coins */

let resizing=false;
let corner;


document.querySelectorAll(".handle")
.forEach(h=>{


h.onmousedown=e=>{

if(locked)return;

resizing=true;

corner=h.id;

startX=e.clientX;
startY=e.clientY;

e.stopPropagation();

};


});


document.onmousemove=e=>{


if(!resizing)return;


let dx=e.clientX-startX;
let dy=e.clientY-startY;


if(corner=="bottom-right"){

box.style.width=
box.offsetWidth+dx+"px";

box.style.height=
box.offsetHeight+dy+"px";

}


};



document.onmouseup=()=>{

resizing=false;

};

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->

<div id="iframe-container">
    <iframe 
        src="https://timmy25px.github.io/iframe-canva-2/"
        allowfullscreen>
    </iframe>
</div>

};

</script>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();


</script>


</body>
</html>
