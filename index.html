<div id="accessScreen" style="
position:fixed;
z-index:9999;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
font-family:Arial;
">
    <input id="codeInput" type="password" placeholder="Code d'accès"
    style="padding:10px;font-size:18px;text-align:center;">

    <button onclick="validateCode()"
    style="margin-top:15px;padding:10px 25px;cursor:pointer;">
        Valider
    </button>

    <div id="error"
    style="color:red;margin-top:10px;"></div>
</div>


<div id="mainContent" style="display:none;">

<div style="position: relative; width: 100%; height: 0; padding-top: 66.6667%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">

<iframe loading="lazy"
style="position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;"
src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
allowfullscreen="allowfullscreen"
allow="fullscreen">
</iframe>

</div>

</div>


<!-- Musique principale -->
<audio id="backgroundMusic" loop>
    <source src="https://drive.google.com/uc?export=download&id=1uSqnzRoFRXHXd797D4a3UDnaKD4suJ3b" type="audio/mpeg">
</audio>


<!-- Son déclenché en 2032 -->
<audio id="zeroSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a"
    type="audio/mp4">
</audio>


<button id="playButton"
style="
display:none;
position:fixed;
right:20px;
bottom:20px;
z-index:9998;
background:rgba(0,0,0,0.6);
color:white;
border:1px solid white;
border-radius:8px;
padding:8px 15px;
cursor:pointer;
">
Play
</button>


<script>

// Hash SHA-256 du code d'accès
const accessHash =
"4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash))
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}


async function validateCode(){

    let input =
    document.getElementById("codeInput").value;

    let hashed =
    await sha256(input);

    if(hashed === accessHash){

        document.getElementById("accessScreen").style.display="none";
        document.getElementById("mainContent").style.display="block";

        startMusic();

    }else{
        document.getElementById("error").innerHTML=
        "Code incorrect";
    }
}



const music =
document.getElementById("backgroundMusic");

const playButton =
document.getElementById("playButton");


function startMusic(){

    music.volume = 1;

    music.play()
    .then(()=>{
        playButton.style.display="none";
    })
    .catch(()=>{
        playButton.style.display="block";
    });

}


playButton.onclick=function(){

    music.play();

    playButton.style.display="none";

};



// Dates UTC

const fadeDate =
new Date("2032-08-28T13:42:50Z");

const zeroDate =
new Date("2032-08-28T13:44:00.000Z");


let fadeStarted=false;
let zeroPlayed=false;


function checkTime(){

    const now=new Date();


    // Fondu 10 secondes
    if(now >= fadeDate &&
       now < new Date(fadeDate.getTime()+10000) &&
       !fadeStarted){

        fadeStarted=true;

        let startVolume=music.volume;
        let start=Date.now();

        let fade=setInterval(()=>{

            let elapsed=Date.now()-start;

            music.volume =
            Math.max(0,
            startVolume*(1-elapsed/10000));

            if(elapsed>=10000){
                clearInterval(fade);
                music.volume=0;
            }

        },50);

    }



    // Son à 13:44:00 UTC

    if(now >= zeroDate && !zeroPlayed){

        zeroPlayed=true;

        document.getElementById("zeroSound").play();

    }

}


setInterval(checkTime,100);

</script>
