<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
#obsToolbar {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 999999;

    display: flex;
    gap: 10px;

    padding: 12px;

    background: rgba(20,20,20,0.85);
    backdrop-filter: blur(10px);

    border-radius: 18px;
}


/* boutons style moderne */

.obsButton,
#formatSelect {

    height: 45px;

    padding: 0 18px;

    border-radius: 12px;

    border: 9px solid transparent;

    border-image: linear-gradient(
        90deg,
        #8C52FF,
        #FF914D
    ) 1;

    background: linear-gradient(
        90deg,
        #FF66C4,
        #FFDE59
    );

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 15px;

}



#sourceIframe {

    position: absolute;

    left:100px;
    top:100px;

    width:1920px;
    height:1080px;

    overflow:hidden;

}


#sourceIframe iframe {

    width:100%;
    height:100%;

    border:0;

    display:block;

}



.handle {

    position:absolute;

    width:14px;
    height:14px;

    background:white;

    border:2px solid black;

    display:none;

}



.edit .handle {

    display:block;

}


.tl {
top:-7px;
left:-7px;
}

.tr {
top:-7px;
right:-7px;
}

.bl {
bottom:-7px;
left:-7px;
}

.br {
bottom:-7px;
right:-7px;
}


</style>


<script>

window.addEventListener("load",()=>{


const box=document.querySelector("#sourceIframe");


/* sécurité si iframe absente */

if(!box){
    console.log("sourceIframe introuvable");
    return;
}



/* création menu */

let menu=document.createElement("div");

menu.id="obsToolbar";


menu.innerHTML=`

<button class="obsButton" id="lockBtn">
🔓 Déverrouiller
</button>


<select id="formatSelect">

<option>Adapter écran</option>
<option>16:9</option>
<option>4:3</option>
<option>16:10</option>
<option>21:9</option>

</select>


<button class="obsButton" id="cropBtn">
✂️ Crop
</button>

`;


document.body.appendChild(menu);




/* poignées */

["tl","tr","bl","br"].forEach(pos=>{

let h=document.createElement("div");

h.className="handle "+pos;

box.appendChild(h);

});




let unlocked=true;


document.querySelector("#lockBtn").onclick=()=>{


unlocked=!unlocked;


if(unlocked){

box.classList.add("edit");

document.querySelector("#lockBtn").textContent=
"🔓 Déverrouiller";

}

else{

box.classList.remove("edit");

document.querySelector("#lockBtn").textContent=
"🔒 Verrouillé";

}


};





/* déplacement */

let moving=false;

let startX=0;
let startY=0;


box.addEventListener("mousedown",e=>{


if(!unlocked)return;


if(e.target.classList.contains("handle"))
return;


moving=true;


startX=e.clientX-box.offsetLeft;
startY=e.clientY-box.offsetTop;


});



document.addEventListener("mousemove",e=>{


if(!moving)return;


box.style.left=(e.clientX-startX)+"px";

box.style.top=(e.clientY-startY)+"px";


});



document.addEventListener("mouseup",()=>{

moving=false;

});






/* formats */

document.querySelector("#formatSelect")
.addEventListener("change",e=>{


switch(e.target.value){


case"Adapter écran":

box.style.width="100vw";
box.style.height="100vh";

break;



case"16:9":

box.style.width="1920px";
box.style.height="1080px";

break;



case"4:3":

box.style.width="1440px";
box.style.height="1080px";

break;



case"16:10":

box.style.width="1920px";
box.style.height="1200px";

break;



case"21:9":

box.style.width="2560px";
box.style.height="1080px";

break;


}



});





/* crop */

let cropped=false;


document.querySelector("#cropBtn").onclick=e=>{


cropped=!cropped;


box.style.clipPath =
cropped ?
"inset(50px 50px 50px 50px)"
:
"none";


e.target.textContent =
cropped ?
"✂️ Crop ON"
:
"✂️ Crop";


};



box.classList.add("edit");


});

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->
<div id="sourceIframe">

<div id="sourceIframe">
    <iframe 
        src="https://timmy25px.github.io/iframe-canva-2/"
        allowfullscreen>
    </iframe>
</div>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();

</script>
</body>
</html>
