<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Countdown</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
}

/* Écran de sécurité */
#accessScreen {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: Arial, sans-serif;
}

#accessBox {
    text-align: center;
}

#codeInput {
    padding: 12px;
    font-size: 18px;
    border-radius: 6px;
    border: none;
    text-align: center;
}

#validateBtn {
    margin-top: 15px;
    padding: 10px 25px;
    cursor: pointer;
    border-radius: 6px;
    border: none;
}

#error {
    margin-top: 10px;
    color: red;
}

/* Bouton Play */
#playButton {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 10000;
    display: none;
    opacity: 0.5;
    background: black;
    color: white;
    border: 1px solid white;
    border-radius: 5px;
    padding: 8px 14px;
    cursor: pointer;
}

/* Fondu blanc */
#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 50000;
}
</style>

</head>

<body>


<!-- Demande de code -->
<div id="accessScreen">

    <div id="accessBox">

        <h2>Accès protégé</h2>

        <input id="codeInput"
        type="password"
        placeholder="Code d'accès">

        <br>

        <button id="validateBtn">
        Valider
        </button>

        <div id="error"></div>

    </div>

</div>



<!-- DESIGN CANVA ORIGINAL -->

<div style="position: relative; width: 100%; height: 0; padding-top: 66.6667%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">

<iframe loading="lazy"
style="position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;"
src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
allowfullscreen="allowfullscreen"
allow="fullscreen">
</iframe>

</div>



<a href="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?utm_content=DAHQHalUtOM&utm_campaign=designshare&utm_medium=embeds&utm_source=link"
target="_blank"
rel="noopener">
_
</a>
par Tim Gaudinaud



<!-- Audio -->

<audio id="music" loop>
<source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="zeroSound">
<source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<button id="playButton">
Play
</button>


<div id="whiteFade"></div>



<script>


/* Empreinte SHA-256 du code */
const validHash =
"5e2e3f9d8a7a9a7f0c3c9c6a6e7b1f7f9d8b1e1d3a5b7c9d8e6f7a8b9c0d1e2f";


async function sha256(text){

const data =
new TextEncoder().encode(text);

const hash =
await crypto.subtle.digest(
"SHA-256",
data
);

return Array.from(
new Uint8Array(hash)
)
.map(x=>x.toString(16).padStart(2,"0"))
.join("");

}



const accessScreen =
document.getElementById("accessScreen");

const input =
document.getElementById("codeInput");

const button =
document.getElementById("validateBtn");

const error =
document.getElementById("error");

const music =
document.getElementById("music");

const zero =
document.getElementById("zeroSound");

const play =
document.getElementById("playButton");

let unlocked=false;



button.onclick = async()=>{

const hash =
await sha256(input.value);


if(hash === validHash){

unlocked=true;

accessScreen.style.display="none";

music.volume=1;

music.play().catch(()=>{

play.style.display="block";

});


}else{

error.textContent="Code incorrect";

}

};



play.onclick=()=>{

music.play();

play.style.display="none";

};



/* Synchronisation UTC */

function getUTC(){

return new Date();

}



let fadeDone=false;
let whiteDone=false;
let zeroDone=false;



function checkTime(){


if(!unlocked)
return;


let now=getUTC();


/* 28/08/2032 13:42:50 UTC */

let fadeDate =
new Date("2032-08-28T13:42:50Z");


if(now>=fadeDate && !fadeDone){

fadeDone=true;

let start=Date.now();

let interval=setInterval(()=>{

let elapsed =
(Date.now()-start)/1000;

music.volume =
Math.max(0,1-(elapsed/10));


if(elapsed>=10){

clearInterval(interval);

}

},50);

}



/* Fondu blanc 13:43:59 */

let whiteDate =
new Date("2032-08-28T13:43:59Z");


if(now>=whiteDate && !whiteDone){

whiteDone=true;

let fade =
document.getElementById("whiteFade");

fade.style.transition=
"opacity 1s";

fade.style.opacity=1;

}



/* Second son 13:44:00 */

let zeroDate =
new Date("2032-08-28T13:44:00Z");


if(now>=zeroDate && !zeroDone){

zeroDone=true;

music.pause();

zero.play();


zero.onended=()=>{

music.currentTime=0;

music.volume=1;

music.play();

};

}


}


setInterval(checkTime,250);



</script>


</body>
</html>
