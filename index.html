<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:black;
}


/* SOURCE COMME OBS */

#sourceIframe{

    position:absolute;

    left:100px;
    top:100px;

    width:1920px;
    height:1080px;

    overflow:hidden;

    border:9px solid transparent;

    border-image:linear-gradient(
        90deg,
        #8C52FF,
        #FF914D
    ) 1;

    box-sizing:border-box;

}


#sourceIframe iframe{

    width:100%;
    height:100%;

    border:0;

    display:block;

}



/* MODE VERROUILLÉ */

.locked{

    border-color:transparent !important;

}



/* BARRE OUTILS */

#obsToolbar{

    position:fixed;

    top:20px;
    left:20px;

    z-index:99999;

    display:flex;

    gap:10px;

    padding:12px;

    border-radius:16px;

    background:rgba(20,20,20,.85);

    backdrop-filter:blur(10px);

}



/* BOUTONS */

.obsButton,
#formatSelect{

    height:45px;

    padding:0 18px;

    border-radius:12px;

    border:4px solid transparent;

    border-image:linear-gradient(
        90deg,
        #8C52FF,
        #FF914D
    ) 1;


    background:linear-gradient(
        90deg,
        #FF66C4,
        #FFDE59
    );


    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    text-shadow:
    0 1px 3px black;


}


.obsButton:hover,
#formatSelect:hover{

    filter:brightness(1.1);

}



/* POIGNÉES */

.handle{

    position:absolute;

    width:14px;
    height:14px;

    background:white;

    border:2px solid black;

    z-index:20;

    display:none;

}



.edit .handle{

    display:block;

}


.tl{
    top:-7px;
    left:-7px;
    cursor:nwse-resize;
}

.tr{
    top:-7px;
    right:-7px;
    cursor:nesw-resize;
}

.bl{
    bottom:-7px;
    left:-7px;
    cursor:nesw-resize;
}

.br{
    bottom:-7px;
    right:-7px;
    cursor:nwse-resize;
}



</style>



<script>


window.onload=function(){



const box=document.getElementById("sourceIframe");



/* ajout poignées */

["tl","tr","bl","br"].forEach(c=>{

let h=document.createElement("div");

h.className="handle "+c;

box.appendChild(h);


});





/* barre */

let toolbar=document.createElement("div");

toolbar.id="obsToolbar";


toolbar.innerHTML=`

<button class="obsButton" id="lockBtn">
🔓 Déverrouiller
</button>


<select id="formatSelect">

<option>
Adapter écran
</option>

<option>
16:9
</option>

<option>
4:3
</option>

<option>
16:10
</option>

<option>
21:9
</option>

</select>



<button class="obsButton" id="cropBtn">
✂️ Crop
</button>

`;

document.body.appendChild(toolbar);





let unlocked=true;



document.getElementById("lockBtn").onclick=function(){


unlocked=!unlocked;


if(unlocked){

box.classList.add("edit");

this.innerHTML="🔓 Déverrouiller";

}

else{

box.classList.remove("edit");

this.innerHTML="🔒 Verrouillé";

}


};





/* déplacement */


let move=false;

let offsetX=0;
let offsetY=0;



box.onmousedown=function(e){


if(!unlocked)return;


if(e.target.classList.contains("handle"))
return;


move=true;


offsetX=e.clientX-box.offsetLeft;
offsetY=e.clientY-box.offsetTop;


};



document.onmousemove=function(e){


if(move){

box.style.left=
(e.clientX-offsetX)+"px";


box.style.top=
(e.clientY-offsetY)+"px";


}


};



document.onmouseup=function(){

move=false;

};





/* formats */


document.getElementById("formatSelect").onchange=function(){


switch(this.value){


case"Adapter écran":

box.style.width="100vw";
box.style.height="100vh";

break;


case"16:9":

box.style.width="1920px";
box.style.height="1080px";

break;


case"4:3":

box.style.width="1440px";
box.style.height="1080px";

break;


case"16:10":

box.style.width="1920px";
box.style.height="1200px";

break;


case"21:9":

box.style.width="2560px";
box.style.height="1080px";

break;


}


};



document.getElementById("cropBtn").onclick=function(){


if(box.style.clipPath){

box.style.clipPath="";

this.innerHTML="✂️ Crop";

}

else{

box.style.clipPath="inset(50px 50px 50px 50px)";

this.innerHTML="✂️ Crop ON";

}


};



box.classList.add("edit");


};

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->
<div id="sourceIframe">

<div id="sourceIframe">
    <iframe 
        src="https://timmy25px.github.io/iframe-canva-2/"
        allowfullscreen>
    </iframe>
</div>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();


</script>
</body>
</html>
