<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
html,body{
margin:0;
overflow:hidden;
background:black;
}


#transformBox{

position:absolute;

left:0;
top:0;

width:1920px;
height:1080px;

border:2px dashed white;

resize:both;
overflow:hidden;

}


#transformBox iframe{

width:100%;
height:100%;

border:0;

pointer-events:none;

}


/* poignées de rognage */

#cropLeft,
#cropRight,
#cropTop,
#cropBottom{

position:absolute;

z-index:10;

background:transparent;

}


#cropLeft{
left:-5px;
top:0;
width:10px;
height:100%;
cursor:w-resize;
}


#cropRight{
right:-5px;
top:0;
width:10px;
height:100%;
cursor:e-resize;
}


#cropTop{
top:-5px;
left:0;
height:10px;
width:100%;
cursor:n-resize;
}


#cropBottom{
bottom:-5px;
left:0;
height:10px;
width:100%;
cursor:s-resize;
}



.locked{

border:none!important;

resize:none!important;

}
    
#lockScreen {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    flex-direction: column;
    color: white;
    font-family: Arial, sans-serif;
}

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->

<button id="lockBtn">🔓 Déverrouiller</button>

<div id="transformBox">
    <div id="cropLeft"></div>
    <div id="cropRight"></div>
    <div id="cropTop"></div>
    <div id="cropBottom"></div>

    <iframe 
    src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed">
    </iframe>
</div>


<script>

let locked = true;

const box = document.getElementById("transformBox");
const btn = document.getElementById("lockBtn");


btn.onclick = () => {

    locked = !locked;

    if(locked){
        box.classList.add("locked");
        btn.innerHTML="🔒 Verrouillé";
    }
    else{
        box.classList.remove("locked");
        btn.innerHTML="🔓 Déverrouillé";
    }

};



let move=false;
let startX,startY;
let startLeft,startTop;


box.onmousedown=e=>{

if(locked)return;

move=true;

startX=e.clientX;
startY=e.clientY;

startLeft=box.offsetLeft;
startTop=box.offsetTop;

};


document.onmousemove=e=>{

if(!move)return;

box.style.left=
(startLeft+e.clientX-startX)+"px";

box.style.top=
(startTop+e.clientY-startY)+"px";

};


document.onmouseup=()=>{

move=false;

};

</script>


<script>
let locked = false;

const frame = document.getElementById("editorFrame");
const btn = document.getElementById("lockBtn");


btn.onclick = () => {

    locked = !locked;

    if(locked){

        frame.style.pointerEvents = "none";
        btn.innerHTML = "🔒 Verrouillé";

    } else {

        frame.style.pointerEvents = "auto";
        btn.innerHTML = "🔓 Déverrouiller";

    }

};
</script>

<div class="canva-frame">



<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();


</script>


</body>
</html>
