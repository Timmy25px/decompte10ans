<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Compteur</title>

<style>
<style>

#controleIframe {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 99999;
    background: #111;
    padding: 10px;
    border-radius: 10px;
    color:white;
    font-family:Arial;
}


#controleIframe button,
#controleIframe select {

    margin:3px;
    padding:6px 10px;
    cursor:pointer;

}



#iframeSource {

    position:absolute;

    left:100px;
    top:100px;

    width:1920px;
    height:1080px;

    overflow:hidden;

    resize:both;

    border:2px dashed transparent;

}



#iframeSource.edition {

    border-color:white;

    cursor:move;

}



#iframeSource iframe {

    width:100%;
    height:100%;

    border:0;

    pointer-events:none;

}



#iframeSource.edition iframe {

    pointer-events:none;

}



</style>



<div id="controleIframe">

<button id="lock">
🔓 Déverrouiller
</button>


<select id="format">

<option value="screen">
Adapter écran
</option>

<option value="4/3">
4:3
</option>

<option value="16/9">
16:9
</option>

<option value="16/10">
16:10
</option>

<option value="21/9">
21:9
</option>

<option value="1/1">
1:1
</option>

</select>

</div>



<script>

const box = document.getElementById("iframeSource");
const lock = document.getElementById("lock");
const format = document.getElementById("format");


let unlocked = true;



// verrouillage

lock.onclick = ()=>{

unlocked=!unlocked;


if(unlocked){

box.classList.add("edition");
lock.innerHTML="🔓 Déverrouiller";

}

else{

box.classList.remove("edition");
lock.innerHTML="🔒 Verrouillé";

}

};





// déplacement souris

let move=false;
let x,y;


box.onmousedown=e=>{

if(!unlocked)return;


move=true;

x=e.clientX-box.offsetLeft;
y=e.clientY-box.offsetTop;


};



document.onmousemove=e=>{

if(!move)return;


box.style.left=(e.clientX-x)+"px";
box.style.top=(e.clientY-y)+"px";


};


document.onmouseup=()=>{

move=false;

};







// formats

format.onchange=()=>{


let w=window.innerWidth;
let h=window.innerHeight;


switch(format.value){


case "screen":

box.style.width=w+"px";
box.style.height=h+"px";

break;



case "4/3":

box.style.width="1440px";
box.style.height="1080px";

break;



case "16/9":

box.style.width="1920px";
box.style.height="1080px";

break;



case "16/10":

box.style.width="1920px";
box.style.height="1200px";

break;



case "21/9":

box.style.width="2560px";
box.style.height="1080px";

break;



case "1/1":

box.style.width="1080px";
box.style.height="1080px";

break;


}


};

#lockScreen input {
    padding: 10px;
    font-size: 18px;
    margin-bottom: 10px;
}

#lockScreen button {
    padding: 8px 20px;
    cursor: pointer;
}

#error {
    margin-top: 10px;
    color: red;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#whiteFade {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 99997;
    transition: opacity 1s linear;
}
</style>

</head>

<body>


<div id="lockScreen">

    <input id="codeInput" type="password" placeholder="Code d'accès">

    <button onclick="checkCode()">Valider</button>

    <div id="error"></div>

</div>


<button id="playButton">▶ Play</button>


<div id="whiteFade"></div>


<!-- DESIGN CANVA INCHANGÉ -->

<div id="iframeSource">
    <iframe 
        src="https://timmy25px.github.io/iframe-canva-2/"
        allowfullscreen>
    </iframe>
</div>
    
</script>

<audio id="mainMusic" loop>
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784754618/ezyZip_bxpow8.mp4">
</audio>


<audio id="secondSound">
    <source src="https://res.cloudinary.com/zp5nbve7/video/upload/v1784992368/zero-time_music_gfbxon.m4a">
</audio>



<script>

const validHash = "4af6ea0776625ccaf1d953afb986e306e66c192bffd566983d53970b6c67c76b";


const mainMusic = document.getElementById("mainMusic");
const secondSound = document.getElementById("secondSound");
const playButton = document.getElementById("playButton");


let unlocked = false;



async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}



async function checkCode(){

    const input = document.getElementById("codeInput").value;

    const hash = await sha256(input);


    if(hash === validHash){

        unlocked = true;

        document.getElementById("lockScreen").style.display="none";

        startMusic();

    }

    else{

        document.getElementById("error").innerHTML =
        "Code incorrect ❌";

    }

}



function startMusic(){

    mainMusic.volume = 1;

    mainMusic.play()
    .catch(()=>{

        playButton.style.display="block";

    });

}



playButton.onclick=function(){

    mainMusic.play();

    playButton.style.display="none";

};




// Synchronisation UTC

function utcNow(){

    return new Date();

}


const fadeStart =
Date.UTC(2032,7,28,13,42,50);


const fadeEnd =
Date.UTC(2032,7,28,13,43,0);


const whiteScreen =
Date.UTC(2032,7,28,13,43,59);


const secondStart =
Date.UTC(2032,7,28,13,44,0);



function timer(){

    if(!unlocked){
        requestAnimationFrame(timer);
        return;
    }


    const now = Date.now();



    // Fondu musique principale

    if(now >= fadeStart && now <= fadeEnd){

        let progress =
        (now - fadeStart) /
        (fadeEnd - fadeStart);


        mainMusic.volume =
        Math.max(0,1-progress);

    }



    // Écran blanc

    if(now >= whiteScreen){

        document.getElementById("whiteFade").style.opacity="1";

    }



    // Second son

    if(now >= secondStart && secondSound.paused){

        mainMusic.pause();

        secondSound.play();

        setTimeout(()=>{

            mainMusic.currentTime = 0;
            mainMusic.volume = 1;

            mainMusic.play();

        },10000);

    }


    requestAnimationFrame(timer);

}


timer();


</script>


</body>
</html>
